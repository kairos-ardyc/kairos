default:
  image: gradle:8.9.0-jdk21

variables:
  GIT_STRATEGY: clone
  GIT_FETCH_EXTRA_FLAGS: --tags

before_script:
  - export GRADLE_USER_HOME=$CI_PROJECT_DIR/.gradle

stages:
  - build
  - test
  - publish

build:
  stage: build
  extends:
    - .pull-push-cache
  script:
    - gradle core:build -x core:test
  artifacts:
    paths:
      - core/build

unit-test:
  stage: test
  extends:
    - .pull-push-cache
  dependencies:
    - build
  script: gradle core:test -i
  except:
    - main

create_docker_image:
  stage: publish
  extends:
    - .pull-push-cache
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [ "" ]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile --destination $CI_REGISTRY_IMAGE:$(grep -E "version = \"" build.gradle.kts | cut -d "\"" -f2)
  only:
    - main

create_migrations_docker_image:
  stage: publish
  extends:
    - .pull-push-cache
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [ "" ]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR/migrations --dockerfile $CI_PROJECT_DIR/migrations/Dockerfile --destination $CI_REGISTRY_IMAGE:"$(grep -E "version = \"" build.gradle.kts | cut -d "\"" -f2)"-migrations
  only:
    - main

.pull-push-cache:
  cache:
    - key: gradle-cache
      policy: pull-push
      unprotect: true
      paths:
        - .gradle/
